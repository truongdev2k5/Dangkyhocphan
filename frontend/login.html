<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Hệ Thống Đăng Ký Học Phần</title>
    <link rel="stylesheet" href="shared/style.css" />
  </head>
  <body class="login-page">
    <div class="login-container">
      <div class="login-box">
        <h1>🎓 Hệ Thống Đăng Ký Học Phần</h1>
        <p class="subtitle">Vui lòng đăng nhập để tiếp tục</p>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">👤 Tên Đăng Nhập</label>
            <input
              type="text"
              id="username"
              placeholder="Nhập tên đăng nhập"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">🔐 Mật Khẩu</label>
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <div id="loginError" class="error-message"></div>

          <button type="submit" class="btn btn-primary btn-login">
            Đăng Nhập
          </button>
        </form>

        <!--
        <div class="login-hint">
          <h3>📝 Tài Khoản Mẫu</h3>
          <div class="hint-item">
            <span class="role-badge admin">Admin</span>
            <code>admin / Admin@123</code>
          </div>
          <div class="hint-item">
            <span class="role-badge student">Sinh Viên</span>
            <code>SV001 / Sinhvien@123</code>
          </div>
        </div>
      --></div>
    </div>

    <script src="shared/auth.js"></script>
    <script>
      // Check if already logged in
      if (localStorage.getItem("token")) {
        let user = null;
        try {
          user = JSON.parse(localStorage.getItem("user"));
        } catch {
          user = null;
        }

        if (!user || !user.vai_tro) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
        } else if (user.vai_tro === "admin") {
          window.location.href = "admin/dashboard.html";
        } else {
          window.location.href = "student/dashboard.html";
        }
      }
    </script>
  </body>
</html>
